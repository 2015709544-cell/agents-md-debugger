name: Bug report
description: Report behavior that appears incorrect or crashes.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve agents-md-debugger. Redact private paths and instruction text.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `agents-md-debugger --version`.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide the smallest safe directory layout and command that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and Python version.
    validations:
      required: true
